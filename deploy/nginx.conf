events {}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;
    sendfile on;
    server_tokens off;
    # Large platform files use the 5 MB chunk API. Capping each HTTP request
    # prevents multipart parsing from exhausting the API container's /tmp.
    client_max_body_size 8m;

    map $http_upgrade $connection_upgrade {
        default upgrade;
        ''      close;
    }

    upstream platform_api { server api:8000; }

    # 主站：只提供平台 UI 与 API，不直接提供第三方工具资源。
    server {
        listen 80;
        server_name _;
        root /usr/share/nginx/html;

        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
        add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; font-src 'self' data:; connect-src 'self'; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'self'" always;

        location = /healthz {
            access_log off;
            default_type application/json;
            return 200 '{"status":"ok"}';
        }

        # 大文件直接流向 API，避免 Nginx 再落一份临时文件。
        location = /api/v1/files/upload {
            proxy_pass http://platform_api;
            proxy_request_buffering off;
            proxy_read_timeout 600s;
            proxy_send_timeout 600s;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        location = /api/v1/files/upload/chunk {
            proxy_pass http://platform_api;
            proxy_request_buffering off;
            proxy_read_timeout 120s;
            proxy_send_timeout 120s;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        # Signed download URLs contain a two-minute bearer ticket. Never write
        # the query string to reverse-proxy logs.
        location /api/v1/files/download/ {
            access_log off;
            proxy_pass http://platform_api;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        location /api/ {
            proxy_pass http://platform_api;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        # 工具必须通过独立工具源打开，避免回退到主站同源执行。
        location /tools/ { return 404; }

        location / {
            try_files $uri $uri/ /index.html;
        }
    }

    # 工具站：映射到不同端口/子域，与主站形成浏览器独立源。
    server {
        listen 81;
        server_name _;
        root /usr/share/nginx/html;

        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header Referrer-Policy "no-referrer" always;
        add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;

        location = /healthz {
            access_log off;
            default_type application/json;
            return 200 '{"status":"ok","surface":"tools"}';
        }

        # 票据在工具源兑换，因此 HttpOnly cookie 只属于工具源。
        location /_launch/ {
            access_log off;
            proxy_pass http://platform_api/api/v1/tools/;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        location = /_tool_auth {
            internal;
            proxy_pass http://platform_api/api/v1/tools/authorize-path;
            proxy_pass_request_body off;
            proxy_set_header Content-Length "";
            proxy_set_header X-Original-URI $request_uri;
            proxy_set_header Cookie $http_cookie;
        }

        location /tools/ {
            auth_request /_tool_auth;
            index index.html;
            try_files $uri $uri/ =404;
        }

        include /etc/nginx/tools.d/*.conf;

        location / { return 404; }
    }
}
