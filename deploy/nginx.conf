events {}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;
    sendfile on;
    client_max_body_size 220m;

    map $http_upgrade $connection_upgrade {
        default upgrade;
        ''      close;
    }

    upstream platform_api { server api:8000; }
    upstream demo_dynamic { server demo-dynamic:8080; }

    server {
        listen 80;
        server_name _;
        root /usr/share/nginx/html;

        location /api/ {
            proxy_pass http://platform_api;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        # C 类静态工具：宿主 ./static/tools 直接挂载到这个目录。
        location /tools/ {
            alias /usr/share/nginx/html/tools/;
            index index.html;
            try_files $uri $uri/ =404;
        }

        # A/B 类动态工具：每个工具增加一个同样结构的 location + upstream。
        location /demo-dynamic/ {
            proxy_pass http://demo_dynamic/;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection $connection_upgrade;
            proxy_read_timeout 300s;
        }

        location / {
            try_files $uri $uri/ /index.html;
        }
    }
}
