services:
  api:
    build:
      context: ./backend
    environment:
      APP_ENV: production
      ENV: production
      DEBUG: "false"
      SECRET_KEY: ${SECRET_KEY:?Set SECRET_KEY in .env}
      DATABASE_URL: sqlite+aiosqlite:////data/db/aipower.db
      REDIS_URL: redis://redis:6379/0
      FILE_STORAGE_ROOT: /data/files
      CORS_ORIGINS: ${CORS_ORIGINS:-http://localhost:8080}
    volumes:
      - ./runtime/files:/data/files
      - ./runtime/sqlite:/data/db
    depends_on:
      redis:
        condition: service_healthy
    restart: unless-stopped
    networks: [aipower]

  redis:
    image: redis:7-alpine
    command: redis-server --appendonly yes
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10
    restart: unless-stopped
    networks: [aipower]

  demo-dynamic:
    build:
      context: ./third_party/demo-dynamic
    environment:
      TOOL_DATA_DIR: /data
    volumes:
      - ./runtime/demo-dynamic:/data
    restart: unless-stopped
    networks: [aipower]

  nginx:
    build:
      context: .
      dockerfile: ./deploy/web.Dockerfile
    ports:
      - "${WEB_PORT:-8080}:80"
    volumes:
      - ./deploy/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./static/tools:/usr/share/nginx/html/tools:ro
    depends_on:
      - api
      - demo-dynamic
    restart: unless-stopped
    networks: [aipower]

networks:
  aipower:
    driver: bridge

volumes:
  redis-data:
